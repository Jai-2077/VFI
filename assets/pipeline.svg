<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="t d">
<title id="t">Motion-aware VFI project pipeline</title><desc id="d">Input triplet branches into RAFT motion characterization and frozen VFI baselines. Motion category and quality metrics identify a focus category, then a lightweight correction CNN produces the corrected frame.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071427"/><stop offset="1" stop-color="#172554"/></linearGradient><linearGradient id="a" x1="0" x2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="480" rx="26" fill="url(#bg)"/>
<g stroke="#93c5fd" opacity=".09"><path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200"/><path d="M100 0V480M200 0V480M300 0V480M400 0V480M500 0V480M600 0V480M700 0V480M800 0V480M900 0V480M1000 0V480M1100 0V480"/></g>
<text x="48" y="50" fill="#e0f2fe" font-family="Arial,sans-serif" font-size="25" font-weight="700">From motion diagnosis to targeted correction</text>
<g font-family="Arial,sans-serif">
 <g transform="translate(42 150)"><rect width="190" height="140" rx="18" fill="#0f2747" stroke="#38bdf8" stroke-width="2"/><text x="95" y="30" text-anchor="middle" fill="#bae6fd" font-size="14">DATA TRIPLET</text>
 <g transform="translate(20 46)"><rect width="42" height="40" rx="6" fill="#0284c7"/><rect x="53" width="42" height="40" rx="6" fill="#64748b" stroke="#fbbf24" stroke-dasharray="4 3"/><rect x="106" width="42" height="40" rx="6" fill="#7c3aed"/><text x="21" y="25" text-anchor="middle" fill="white" font-size="13">I₀</text><text x="74" y="25" text-anchor="middle" fill="white" font-size="13">Igt</text><text x="127" y="25" text-anchor="middle" fill="white" font-size="13">I₁</text></g>
 <text x="95" y="112" text-anchor="middle" fill="white" font-size="14" font-weight="700">Ground truth held out</text><text x="95" y="130" text-anchor="middle" fill="#cbd5e1" font-size="12">for supervision/evaluation</text></g>
 <g transform="translate(310 82)"><rect width="235" height="118" rx="18" fill="#162143" stroke="#60a5fa" stroke-width="2"/><circle cx="117" cy="36" r="17" fill="none" stroke="#60a5fa" stroke-width="4" stroke-dasharray="5 5"><animateTransform attributeName="transform" type="rotate" from="0 117 36" to="360 117 36" dur="5s" repeatCount="indefinite"/></circle><text x="117" y="77" text-anchor="middle" fill="white" font-size="17" font-weight="700">RAFT motion analysis</text><text x="117" y="99" text-anchor="middle" fill="#bfdbfe" font-size="13">flow → m, a, o, n → category</text></g>
 <g transform="translate(310 256)"><rect width="235" height="118" rx="18" fill="#202044" stroke="#a78bfa" stroke-width="2"/><text x="117" y="33" text-anchor="middle" fill="#ddd6fe" font-size="14">FROZEN VFI BASELINES</text><text x="117" y="62" text-anchor="middle" fill="white" font-size="19" font-weight="700">RIFE · FILM · IFRNet</text><text x="117" y="91" text-anchor="middle" fill="#c4b5fd" font-size="14">I₀ + I₁ → Iᵦ</text></g>
 <g transform="translate(630 256)"><rect width="190" height="118" rx="18" fill="#102d3c" stroke="#2dd4bf" stroke-width="2"/><text x="95" y="30" text-anchor="middle" fill="#99f6e4" font-size="14">QUALITY METRICS</text><text x="95" y="58" text-anchor="middle" fill="white" font-size="18" font-weight="700">PSNR · SSIM</text><text x="95" y="82" text-anchor="middle" fill="white" font-size="18" font-weight="700">LPIPS</text><text x="95" y="103" text-anchor="middle" fill="#99f6e4" font-size="12">per motion category</text></g>
 <g transform="translate(630 82)"><rect width="190" height="118" rx="18" fill="#30233f" stroke="#f0abfc" stroke-width="2"/><text x="95" y="36" text-anchor="middle" fill="#f5d0fe" font-size="14">DIAGNOSIS</text><text x="95" y="65" text-anchor="middle" fill="white" font-size="17" font-weight="700">Focus category</text><text x="95" y="91" text-anchor="middle" fill="#f5d0fe" font-size="13">fixed scoring rule</text></g>
 <g transform="translate(900 170)"><rect width="250" height="160" rx="20" fill="#143443" stroke="#2dd4bf" stroke-width="2"/><text x="125" y="32" text-anchor="middle" fill="#99f6e4" font-size="14">LIGHTWEIGHT CORRECTION</text><g transform="translate(28 48)"><rect width="55" height="46" rx="7" fill="#0e7490"/><rect x="68" width="55" height="46" rx="7" fill="#4338ca"/><rect x="136" width="55" height="46" rx="7" fill="#0f766e"/><text x="27" y="28" text-anchor="middle" fill="white" font-size="15">R</text><text x="95" y="28" text-anchor="middle" fill="white" font-size="15">M</text><text x="163" y="28" text-anchor="middle" fill="white" font-size="15">Iᶜ</text></g><text x="125" y="121" text-anchor="middle" fill="white" font-size="17" font-weight="700">Iᶜ = Iᵦ + M ⊙ R</text><text x="125" y="143" text-anchor="middle" fill="#99f6e4" font-size="12">train correction, not backbone</text></g>
</g>
<g fill="none" stroke="url(#a)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"><path d="M232 190H270V141H300"/><path d="M232 250H270V315H300"/><path d="M545 315H620"/><path d="M545 141H620"/><path d="M820 315H860V250H890"/><path d="M820 141H860V200H890"/></g>
<g fill="#e0f2fe"><circle r="5"><animateMotion dur="4s" repeatCount="indefinite" path="M232 190H270V141H545H620"/></circle><circle r="5"><animateMotion dur="4.5s" repeatCount="indefinite" path="M545 315H620H820H860V250H900"/></circle></g>
<text x="600" y="438" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="14">Diagnosis and interpolation are separate branches; ground truth never enters either inference input.</text>
</svg>