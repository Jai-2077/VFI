<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Motion-aware video frame interpolation</title>
<desc id="desc">Animated pipeline from input frames through motion diagnosis, frozen interpolation models, lightweight correction, and output frame.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#101d36"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6Z" fill="#7dd3fc"/></marker>
</defs>
<style>
 text{font-family:Inter,ui-sans-serif,Arial,sans-serif}.title{font-size:30px;font-weight:750;fill:#f8fafc}.sub{font-size:14px;fill:#a8b8d0}.head{font-size:17px;font-weight:700;fill:#f8fafc}.small{font-size:12px;fill:#b8c7dd}.tiny{font-size:10px;fill:#9fb1ca}
 .card{fill:#101e33;stroke:#2b4162;stroke-width:1.5}.line{stroke:#7dd3fc;stroke-width:2.4;fill:none;marker-end:url(#arr);stroke-dasharray:8 8;animation:dash 2.4s linear infinite}
 .pulse{animation:pulse 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.float{animation:float 3s ease-in-out infinite}.orbit{transform-origin:600px 345px;animation:orbit 10s linear infinite}
 .dot{fill:#67e8f9;filter:url(#glow);animation:travel 4.8s linear infinite}
 .scan{animation:scan 3.4s ease-in-out infinite}.bar{animation:bar 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:left}
 @keyframes dash{to{stroke-dashoffset:-32}}@keyframes pulse{0%,100%{opacity:.72;transform:scale(1)}50%{opacity:1;transform:scale(1.035)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes travel{0%{transform:translate(0,0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translate(950px,0);opacity:0}}@keyframes scan{0%,100%{transform:translateX(0);opacity:.2}50%{transform:translateX(65px);opacity:.9}}@keyframes bar{0%,100%{transform:scaleX(.72)}50%{transform:scaleX(1)}}
 @media (prefers-reduced-motion:reduce){.line,.pulse,.float,.orbit,.dot,.scan,.bar{animation:none}}
</style>
<rect width="1200" height="650" rx="28" fill="url(#bg)"/>
<circle cx="1060" cy="90" r="160" fill="#1d4ed8" opacity=".09"/><circle cx="120" cy="540" r="190" fill="#06b6d4" opacity=".07"/>
<text x="52" y="58" class="title">Motion-Type-Aware Video Frame Interpolation</text>
<text x="54" y="86" class="sub">Diagnose motion · compare frozen baselines · refine with a lightweight correction network</text>
<g opacity=".45"><path d="M60 120H1140" stroke="#29415f"/><path d="M60 122H360" stroke="#22d3ee" stroke-width="3"/></g>
<!-- stage cards -->
<g class="float">
 <rect x="48" y="170" width="190" height="260" rx="18" class="card"/>
 <text x="68" y="202" class="head">01 · Input frames</text>
 <rect x="68" y="224" width="66" height="80" rx="8" fill="#172c47" stroke="#4b6789"/>
 <rect x="145" y="224" width="66" height="80" rx="8" fill="#172c47" stroke="#4b6789"/>
 <g stroke="#5eead4" stroke-width="2" fill="none"><path d="M78 283 Q94 250 122 244"/><path d="M154 283 Q170 250 198 244"/></g>
 <circle cx="104" cy="255" r="10" fill="#fbbf24"/><circle cx="181" cy="255" r="10" fill="#fbbf24"/>
 <path d="M101 269l-6 12m6-12 7 12m-7-12v18m77-18-6 12m6-12 7 12m-7-12v18" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
 <text x="100" y="322" class="tiny" text-anchor="middle">I₀</text><text x="177" y="322" class="tiny" text-anchor="middle">I₁</text>
 <rect x="68" y="343" width="142" height="44" rx="9" fill="#0a1627" stroke="#304765"/>
 <text x="139" y="361" class="small" text-anchor="middle">Intermediate time</text><text x="139" y="377" class="tiny" text-anchor="middle">estimate Iₜ</text>
 <circle cx="221" cy="192" r="4" fill="#67e8f9" class="pulse"/>
</g>
<path d="M240 300H278" class="line"/>
<g class="pulse">
 <rect x="284" y="170" width="190" height="260" rx="18" class="card"/>
 <text x="304" y="202" class="head">02 · RAFT flow</text>
 <rect x="305" y="222" width="148" height="94" rx="10" fill="#091525" stroke="#34516f"/>
 <g stroke-width="2" fill="none" opacity=".9">
 <path d="M321 241l18 6m-18-6 6 15M349 264l20-8m-20 8 4 16M379 241l14 12m-14-12-2 16M409 276l19-10m-19 10 4 16" stroke="#22d3ee"/>
 <path d="M322 290l17-10m-17 10 10 10M366 238l5 15m-5-15-12 8M398 249l15 9m-15-9-1 14" stroke="#a78bfa"/>
 </g>
 <g class="scan"><rect x="310" y="226" width="5" height="86" rx="2" fill="#67e8f9" opacity=".65"/></g>
 <text x="379" y="339" class="small" text-anchor="middle">Flow descriptors</text>
 <text x="379" y="358" class="tiny" text-anchor="middle">direction · magnitude</text>
 <text x="379" y="374" class="tiny" text-anchor="middle">consistency · variation</text>
 <rect x="305" y="390" width="148" height="23" rx="11" fill="#102c46" stroke="#1e7492"/>
 <text x="379" y="405" class="tiny" text-anchor="middle">Motion-aware grouping</text>
</g>
<path d="M476 300H514" class="line"/>
<g class="float">
 <rect x="520" y="170" width="190" height="260" rx="18" class="card"/>
 <text x="540" y="202" class="head">03 · Frozen VFI</text>
 <rect x="540" y="223" width="150" height="42" rx="9" fill="#14294a" stroke="#3b82f6"/>
 <text x="615" y="249" class="head" text-anchor="middle">RIFE</text>
 <rect x="540" y="277" width="150" height="42" rx="9" fill="#142344" stroke="#818cf8"/>
 <text x="615" y="303" class="head" text-anchor="middle">FILM</text>
 <rect x="540" y="331" width="150" height="42" rx="9" fill="#1b2142" stroke="#a78bfa"/>
 <text x="615" y="357" class="head" text-anchor="middle">IFRNet</text>
 <text x="615" y="397" class="small" text-anchor="middle">Baseline comparison</text>
 <text x="615" y="414" class="tiny" text-anchor="middle">pretrained weights frozen</text>
</g>
<path d="M712 300H750" class="line"/>
<g class="pulse">
 <rect x="756" y="170" width="190" height="260" rx="18" class="card"/>
 <text x="776" y="202" class="head">04 · Correction</text>
 <rect x="777" y="224" width="148" height="47" rx="9" fill="#221e48" stroke="#8b5cf6"/>
 <text x="851" y="243" class="small" text-anchor="middle">Residual R</text><text x="851" y="258" class="tiny" text-anchor="middle">learned refinement</text>
 <rect x="777" y="282" width="148" height="47" rx="9" fill="#103743" stroke="#22d3ee"/>
 <text x="851" y="301" class="small" text-anchor="middle">Confidence mask M</text><text x="851" y="316" class="tiny" text-anchor="middle">spatial weighting</text>
 <path d="M851 332V351" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arr)"/>
 <rect x="777" y="357" width="148" height="43" rx="9" fill="#123a39" stroke="#34d399"/>
 <text x="851" y="383" class="head" text-anchor="middle">Iᶜ = Iᵇ + M ⊙ R</text>
 <text x="851" y="416" class="tiny" text-anchor="middle">lightweight CNN</text>
</g>
<path d="M948 300H986" class="line"/>
<g class="float">
 <rect x="992" y="170" width="160" height="260" rx="18" class="card"/>
 <text x="1010" y="202" class="head">05 · Evaluate</text>
 <rect x="1010" y="224" width="124" height="74" rx="9" fill="#0a1728" stroke="#36516f"/>
 <rect x="1021" y="238" width="25" height="43" rx="4" fill="#164e63"/><rect x="1055" y="250" width="25" height="31" rx="4" fill="#4f46e5"/><rect x="1089" y="232" width="25" height="49" rx="4" fill="#0f766e"/>
 <path d="M1019 286H1124" stroke="#7890ad"/>
 <text x="1072" y="319" class="small" text-anchor="middle">PSNR · SSIM</text><text x="1072" y="337" class="small" text-anchor="middle">LPIPS · latency</text>
 <text x="1072" y="369" class="tiny" text-anchor="middle">per motion category</text>
 <text x="1072" y="385" class="tiny" text-anchor="middle">and model</text>
</g>
<!-- animated particles across pipeline -->
<circle class="dot" cx="245" cy="300" r="4"/><circle class="dot" cx="245" cy="310" r="3" style="animation-delay:1.2s"/><circle class="dot" cx="245" cy="290" r="3" style="animation-delay:2.4s"/>
<g transform="translate(0 0)">
 <rect x="48" y="470" width="1104" height="115" rx="18" fill="#0b1728" stroke="#253d5d"/>
 <text x="72" y="502" class="head">Four operational motion categories</text>
 <g transform="translate(72 520)"><rect width="236" height="42" rx="10" fill="#102b3e" stroke="#1e7492"/><path d="M14 29l30-14m-22 14 8-13m-8 13 13-1" stroke="#67e8f9" stroke-width="2" fill="none"/><text x="58" y="26" class="small">Near-linear</text></g>
 <g transform="translate(330 520)"><rect width="236" height="42" rx="10" fill="#211f45" stroke="#6d5bd0"/><path d="M15 28a14 14 0 0 1 25-13m0 0-1 9m1-9-9 2" stroke="#c4b5fd" stroke-width="2" fill="none"/><text x="58" y="26" class="small">Rotation / curved</text></g>
 <g transform="translate(588 520)"><rect width="236" height="42" rx="10" fill="#3a2918" stroke="#a16207"/><rect x="14" y="12" width="18" height="18" fill="#f59e0b" opacity=".85"/><path d="M34 12l10 18" stroke="#fde68a" stroke-width="2" stroke-dasharray="3 3"/><text x="58" y="26" class="small">Occlusion-heavy</text></g>
 <g transform="translate(846 520)"><rect width="236" height="42" rx="10" fill="#153329" stroke="#24805b"/><path d="M13 20q7-14 14 0t14 0" stroke="#6ee7b7" stroke-width="2" fill="none"/><text x="58" y="26" class="small">Non-rigid</text></g>
</g>
<text x="600" y="620" class="tiny" text-anchor="middle">Frozen interpolation backbones · diagnosis-guided experiments · lightweight residual refinement</text>
</svg>