<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="t d">
<title id="t">Evaluation at a glance</title>
<desc id="d">Separated metric labels and values, baseline latency bars, and evaluation category counts.</desc>
<style>
text{font-family:Inter,Arial,sans-serif}
.title{font-size:22px;font-weight:700;fill:#f8fafc}
.sub{font-size:13px;fill:#b8c7dd}
.metric{font-size:17px;font-weight:700;fill:#f8fafc}
.number{font-size:19px;font-weight:750;fill:#67e8f9}
.panel{fill:#0d1a2d;stroke:#29415f;stroke-width:1.5}
.bar{animation:grow 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:left}
@keyframes grow{0%,100%{transform:scaleX(.78)}50%{transform:scaleX(1)}}
@media(prefers-reduced-motion:reduce){.bar{animation:none}}
</style>
<rect width="1000" height="390" rx="24" fill="#08111f"/>
<text x="34" y="42" class="title">Evaluation at a glance</text>
<text x="34" y="66" class="sub">Reported measurements · correction changes relative to the corresponding frozen baseline</text>

<!-- Quality metrics: labels and values occupy separate rows to prevent collision -->
<g transform="translate(32 94)">
 <rect width="294" height="238" rx="16" class="panel"/>
 <text x="22" y="31" class="metric">Quality metrics</text>

 <text x="22" y="57" class="sub">PSNR change · RIFE generic</text>
 <text x="22" y="78" class="number">+0.1427 dB</text>
 <rect x="22" y="87" width="248" height="7" rx="3.5" fill="#182b45"/>
 <rect x="22" y="87" width="210" height="7" rx="3.5" fill="#22d3ee" class="bar"/>

 <text x="22" y="119" class="sub">SSIM change · RIFE generic</text>
 <text x="22" y="140" class="number">+0.001256</text>
 <rect x="22" y="149" width="248" height="7" rx="3.5" fill="#182b45"/>
 <rect x="22" y="149" width="193" height="7" rx="3.5" fill="#818cf8" class="bar" style="animation-delay:.3s"/>

 <text x="22" y="181" class="sub">LPIPS reduction · RIFE targeted</text>
 <text x="22" y="202" class="number">0.000150</text>
 <rect x="22" y="211" width="248" height="7" rx="3.5" fill="#182b45"/>
 <rect x="22" y="211" width="166" height="7" rx="3.5" fill="#34d399" class="bar" style="animation-delay:.6s"/>
</g>

<g transform="translate(352 94)">
 <rect width="294" height="238" rx="16" class="panel"/>
 <text x="22" y="31" class="metric">Baseline latency</text>
 <text x="22" y="62" class="sub">RIFE</text><text x="270" y="62" class="number" text-anchor="end">9.30 ms</text>
 <rect x="22" y="74" width="248" height="8" rx="4" fill="#182b45"/><rect x="22" y="74" width="34" height="8" rx="4" fill="#22d3ee" class="bar"/>
 <text x="22" y="108" class="sub">IFRNet</text><text x="270" y="108" class="number" text-anchor="end">11.03 ms</text>
 <rect x="22" y="120" width="248" height="8" rx="4" fill="#182b45"/><rect x="22" y="120" width="40" height="8" rx="4" fill="#818cf8" class="bar" style="animation-delay:.3s"/>
 <text x="22" y="154" class="sub">FILM</text><text x="270" y="154" class="number" text-anchor="end">173.63 ms</text>
 <rect x="22" y="166" width="248" height="8" rx="4" fill="#182b45"/><rect x="22" y="166" width="248" height="8" rx="4" fill="#34d399" class="bar" style="animation-delay:.6s"/>
 <text x="22" y="211" class="sub">Baseline timing only</text>
 <text x="22" y="228" class="sub">Corrected latency is not shown.</text>
</g>

<g transform="translate(672 94)">
 <rect width="296" height="238" rx="16" class="panel"/>
 <text x="22" y="31" class="metric">Evaluation coverage</text>
 <text x="22" y="69" class="number" style="font-size:25px">3,601</text>
 <text x="22" y="89" class="sub">paired evaluation clips</text>
 <rect x="22" y="105" width="252" height="15" rx="7.5" fill="#182b45"/>
 <rect x="22" y="105" width="135" height="15" rx="7.5" fill="#22d3ee"/>
 <rect x="157" y="105" width="82" height="15" fill="#818cf8"/>
 <rect x="239" y="105" width="23" height="15" fill="#f59e0b"/>
 <rect x="262" y="105" width="12" height="15" rx="6" fill="#34d399"/>
 <text x="22" y="146" class="sub">Near-linear · 1,928</text>
 <text x="22" y="168" class="sub">Non-rigid · 1,171</text>
 <text x="22" y="190" class="sub">Occlusion · 322</text>
 <text x="22" y="212" class="sub">Rotation · 180</text>
</g>
<text x="500" y="366" class="sub" text-anchor="middle">See the README tables for complete per-model and per-configuration values.</text>
</svg>