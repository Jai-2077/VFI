<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="t d">
<title id="t">Reported correction results</title><desc id="d">A motion graphic showing the three quality metrics and model latency measurements summarized in the project README.</desc>
<style>
text{font-family:Inter,Arial,sans-serif}.title{font-size:22px;font-weight:700;fill:#f8fafc}.sub{font-size:13px;fill:#b8c7dd}.metric{font-size:17px;font-weight:700;fill:#f8fafc}.number{font-size:20px;font-weight:750;fill:#67e8f9}.panel{fill:#0d1a2d;stroke:#29415f;stroke-width:1.5}.bar{animation:grow 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:left}.pulse{animation:pulse 2.5s ease-in-out infinite}@keyframes grow{0%,100%{transform:scaleX(.72)}50%{transform:scaleX(1)}}@keyframes pulse{0%,100%{opacity:.75}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.bar,.pulse{animation:none}}
</style>
<rect width="1000" height="390" rx="24" fill="#08111f"/>
<text x="34" y="42" class="title">Evaluation at a glance</text><text x="34" y="66" class="sub">Reported measurements · correction changes relative to the corresponding frozen baseline</text>
<g transform="translate(32 94)">
 <rect width="294" height="238" rx="16" class="panel"/><text x="22" y="34" class="metric">Quality metrics</text>
 <text x="22" y="69" class="sub">PSNR change · RIFE generic</text><text x="260" y="69" class="number" text-anchor="end">+0.1427 dB</text><rect x="22" y="81" width="248" height="9" rx="4" fill="#182b45"/><rect x="22" y="81" width="210" height="9" rx="4" fill="#22d3ee" class="bar"/>
 <text x="22" y="124" class="sub">SSIM change · RIFE generic</text><text x="260" y="124" class="number" text-anchor="end">+0.001256</text><rect x="22" y="136" width="248" height="9" rx="4" fill="#182b45"/><rect x="22" y="136" width="193" height="9" rx="4" fill="#818cf8" class="bar" style="animation-delay:.3s"/>
 <text x="22" y="179" class="sub">LPIPS reduction · RIFE targeted</text><text x="260" y="179" class="number" text-anchor="end">0.000150</text><rect x="22" y="191" width="248" height="9" rx="4" fill="#182b45"/><rect x="22" y="191" width="166" height="9" rx="4" fill="#34d399" class="bar" style="animation-delay:.6s"/>
 <text x="22" y="221" class="sub">Illustrative bar lengths are not a shared scale.</text>
</g>
<g transform="translate(352 94)">
 <rect width="294" height="238" rx="16" class="panel"/><text x="22" y="34" class="metric">Baseline latency</text>
 <text x="22" y="68" class="sub">RIFE</text><text x="270" y="68" class="number" text-anchor="end">9.30 ms</text><rect x="22" y="80" width="248" height="9" rx="4" fill="#182b45"/><rect x="22" y="80" width="34" height="9" rx="4" fill="#22d3ee" class="bar"/>
 <text x="22" y="117" class="sub">IFRNet</text><text x="270" y="117" class="number" text-anchor="end">11.03 ms</text><rect x="22" y="129" width="248" height="9" rx="4" fill="#182b45"/><rect x="22" y="129" width="40" height="9" rx="4" fill="#818cf8" class="bar" style="animation-delay:.3s"/>
 <text x="22" y="166" class="sub">FILM</text><text x="270" y="166" class="number" text-anchor="end">173.63 ms</text><rect x="22" y="178" width="248" height="9" rx="4" fill="#182b45"/><rect x="22" y="178" width="248" height="9" rx="4" fill="#34d399" class="bar" style="animation-delay:.6s"/>
 <text x="22" y="221" class="sub">Reported baseline timing, not corrected latency.</text>
</g>
<g transform="translate(672 94)">
 <rect width="296" height="238" rx="16" class="panel"/><text x="22" y="34" class="metric">Evaluation coverage</text>
 <text x="22" y="78" class="number">3,601</text><text x="22" y="99" class="sub">paired evaluation clips</text>
 <rect x="22" y="119" width="252" height="16" rx="8" fill="#182b45"/><rect x="22" y="119" width="135" height="16" rx="8" fill="#22d3ee"/><rect x="157" y="119" width="82" height="16" fill="#818cf8"/><rect x="239" y="119" width="23" height="16" fill="#f59e0b"/><rect x="262" y="119" width="12" height="16" rx="6" fill="#34d399"/>
 <text x="22" y="161" class="sub">Near-linear · 1,928</text><text x="22" y="183" class="sub">Non-rigid · 1,171</text><text x="22" y="205" class="sub">Occlusion · 322</text><text x="160" y="205" class="sub">Rotation · 180</text>
</g>
<text x="500" y="366" class="sub" text-anchor="middle">See the README tables for complete per-model and per-configuration values.</text>
</svg>